; AtomS3R + Atomic Battery Base + Unit Scroll (Grove port) digital ruler.
; Library versions are exact pins so a fresh .pio resolves the same image.

[env:m5stack-atoms3r]
platform = espressif32@6.9.0
; The AtomS3R uses the same ESP32-S3 module layout as the AtomS3 (8 MB flash),
; and M5Unified detects the R variant at runtime.
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
test_ignore = *

; Host-side unit tests for lib/RulerCore: `pio test -e native`
[env:native]
platform = native
test_build_src = no
